name: Windows test build

# Manually triggered Windows desktop build for testing — produces the
# x64 NSIS `.exe` installer and uploads it as a workflow artifact that
# can be downloaded from the run page. Unlike the tag-triggered
# `release.yml`, this one does NOT cut a GitHub Release or publish
# anything; it's a fast iteration path for verifying Windows-specific
# fixes (installer tweaks, file associations, native-module bundling,
# etc.) on a real Windows build without going through a versioned
# release cycle.
#
# Run from the Actions tab → "Windows test build" → "Run workflow",
# or via `gh workflow run win-test-build.yml --ref <branch>`.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        # Mirrors release.yml — apps/desktop intentionally isn't in
        # the npm workspaces array because electron-builder's internal
        # install step prunes hoisted dev-deps mid-build. Install
        # separately.
        run: npm --prefix apps/desktop ci

      - name: Bake relay token into the build
        # Mirrors release.yml — writes the PAIRING_TOKEN secret into
        # the (otherwise empty) pairing-build.ts in this ephemeral
        # checkout only, so cross-machine card sharing works in test
        # builds too. No-op (empty token) if the secret isn't set.
        env:
          PAIRING_TOKEN: ${{ secrets.PAIRING_TOKEN }}
        run: node apps/desktop/scripts/inject-relay-token.cjs

      - name: Build desktop installer
        # `--publish never` keeps electron-builder from publishing to
        # GitHub Releases (the package.json `publish` block is for
        # release.yml). `--win` pins the target even though the
        # runner's host platform would select it anyway. Both flow
        # through `npm run` → `dist` → the trailing bare
        # `electron-builder` call.
        run: npm --prefix apps/desktop run dist -- --win --publish never

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardmirror-win-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
