# One-command self-hosted CardMirror relay:
#   RELAY_TOKEN=$(openssl rand -hex 24) docker compose up -d
# Then set Settings → Card Sharing → Custom relay URL to
# http://<host>:8410/relay and Custom relay token to the same token.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 3s
      retries: 10

  relay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN}
      # Which GitHub repos your users' plugin installers accept
      # (comma-separated owner/repo). Plugins are full-trust code —
      # curate deliberately. Defaults to the app's baked list.
      RELAY_PLUGIN_ALLOWLIST: ${RELAY_PLUGIN_ALLOWLIST:-shreerammodi/ebb,shreerammodi/cardmirror-ebb-plugin}
      # Federation (optional; see README → Federation). Off unless
      # RELAY_FEDERATION=on, which also needs RELAY_PUBLIC_URL.
      RELAY_FEDERATION: ${RELAY_FEDERATION:-}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-}
      RELAY_NICKNAME: ${RELAY_NICKNAME:-}
      RELAY_FEDERATION_ALLOW: ${RELAY_FEDERATION_ALLOW:-}
      RELAY_FEDERATION_DENY: ${RELAY_FEDERATION_DENY:-}
      # LAN / development federations: allow plain-http peers and peers
      # on private or loopback addresses (both off by default).
      RELAY_FEDERATION_ALLOW_HTTP: ${RELAY_FEDERATION_ALLOW_HTTP:-}
      RELAY_FEDERATION_ALLOW_PRIVATE: ${RELAY_FEDERATION_ALLOW_PRIVATE:-}
    ports:
      - "8410:8000"

volumes:
  relay_pgdata:
